name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    env:
      YOSPACE_USER: ${{ secrets.YOSPACE_USER }}
      YOSPACE_TOKEN: ${{ secrets.YOSPACE_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify CHANGELOG format
        run: ./gradlew getChangelog -q --console=plain --unreleased

      # `build` already depends on `lint`, so a separate lint step just re-runs it.
      - name: Build
        run: ./gradlew build
