name: Yospace Validation Logs

on:
  workflow_dispatch:
    inputs:
      submission:
        description: Yospace validation submission to capture
        required: true
        default: all
        type: choice
        options:
          - all
          - vod
          - dvr-live-direct

permissions:
  contents: read

jobs:
  capture:
    name: Capture validation logs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YOSPACE_USER: ${{ secrets.YOSPACE_USER }}
      YOSPACE_TOKEN: ${{ secrets.YOSPACE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Check Yospace credentials
        run: |
          if [ -z "$YOSPACE_USER" ] || [ -z "$YOSPACE_TOKEN" ]; then
            echo "::error::YOSPACE_USER and YOSPACE_TOKEN repository secrets are required."
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture logs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: scripts/capture-yospace-validation-logs.sh --submission "${{ inputs.submission }}" --output-dir build/yospace-validation

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yospace-validation-${{ inputs.submission }}-${{ github.run_attempt }}
          path: build/yospace-validation/**
          if-no-files-found: warn
